name: Generate Analytics Presentation Dashboard

on:
  push:
    paths:
      - 'raw_log.txt'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  render-and-host:
    runs-on: ubuntu-latest
    steps:
      - name: Shallow Checkout (Fastest Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Only downloads the latest commit, skipping heavy history files

      # REMOVED setup-python: We bypass download overhead by calling the pre-installed system python environment directly
      - name: Run Dashboard Generator
        run: python3 compile_data.py

      - name: Upload Workspace Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy Live Dashboard via GitHub Pages
        uses: actions/deploy-pages@v4
