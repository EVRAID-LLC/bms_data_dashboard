name: Generate Analytics Presentation Dashboard

on:
  push:
    paths:
      - 'raw_log.txt'
  workflow_dispatch:

# We explicitly request minimal permissions needed ONLY for pages hosting
permissions:
  pages: write
  id-token: write

jobs:
  render-and-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Runtime Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Compilation and Visualization Engine
        run: python compile_data.py

      - name: Configure Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Workspace Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy Live Dashboard via GitHub Pages
        uses: actions/deploy-pages@v4
