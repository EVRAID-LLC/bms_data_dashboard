name: Generate Analytics Presentation Dashboard

on:
  push:
    paths:
      - 'raw_log.txt'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  render-and-host:
    runs-on: ubuntu-latest
    steps:
      - name: Shallow Checkout (Fastest Clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Data Visualization Dependencies
        run: pip install plotly

      - name: Run Dashboard Generator
        run: python compile_data.py

      - name: Upload Workspace Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy Live Dashboard via GitHub Pages
        uses: actions/deploy-pages@v4
